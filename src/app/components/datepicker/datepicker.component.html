<div>
    for test mode: <button type="button" (click)="toggleMode()">change</button> <b> {{mode}} </b>
</div>

<div class="dropdown relative">
    @if (label) {
        <label (click)="toggleCalendar()" class="{{LabelClass}}">{{label}}</label>
    }
    <div class="relative">
        <div #trigger (click)="toggleCalendar()" class="flex justify-between w-full min-w-[220px] h-[2rem] border px-2 py-1 hover:cursor-pointer bg-white">
            <span>
                {{selectedDate.start | date}}
                @if(selectedDate.end && selectedDate.end != '') {
                    - {{selectedDate.end | date}}
                }
            </span>
            @if (!isCalendarVisible){
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z" />
                </svg>
            } @else {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="blue" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z" />
                </svg>
            }
        </div>
    </div>
</div>

<ng-template #dropdownTemplate>
    <div class="datepicker-content absolute left-0 border rounded w-[350px] shadow-2xl p-1 z-40 bg-white">
        <div class="flex gap-[15px] mx-[10px]">
            <div class="max-h-[400px]">
                <div class="-datepicker-container text-center">
                    <div class="-datepicker-header flex justify-between items-center mb-[10px]">
                        <button (click)="changeMonth(-1)" class="size-6 transition-transform duration-100 hover:scale-105 active:scale-95">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 9-3 3m0 0 3 3m-3-3h7.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                            </svg>
                        </button>
                        <span>{{ currentStateDate | date: 'MMMM yyyy' }}</span>
                        <button (click)="changeMonth(1)" class="size-6 transition-transform duration-100 hover:scale-105 active:scale-95">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m12.75 15 3-3m0 0-3-3m3 3h-7.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                            </svg>
                        </button>
                    </div>

                    <div class="-datepicker-grid grid grid-cols-7 gap-[5px]">
                        <div class="-day-label font-bold p-[5px]" *ngFor="let day of ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']">
                            {{ day }}
                        </div>
                        <div class="-day-cell p-[3px] border border-[#ddd] text-center"
                             *ngFor="let item of days"
                             (click)="selectDay(item.day)"
                             [ngClass]="{
                            '-selected bg-[#CFE7F5]': item.selected,
                            '-empty bg-[#f9f9f9]': item.day === 0,
                            '-today text-[#F10000] font-medium border-[#7c7c7c]': item.day === currentDay && currentStateDate.getMonth() === currentMonth,
                            'cursor-pointer hover:border-[#7c7c7c] hover:bg-[#CFE7F5]': item.day !== 0
                          }">
                            {{ item.day || '' }}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</ng-template>
